[project]
name = "tin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dexxf", email = "dexter101306@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "authlib>=1.9.10",
    "fastapi[standard]>=0.165.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.4.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.9",
]

[project.scripts]
tin = "tin:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
